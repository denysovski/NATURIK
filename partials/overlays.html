<div class="overlay" data-overlay></div>
<aside class="drawer" data-cart aria-label="Shopping bag" aria-hidden="true" tabindex="-1">
  <div class="drawer__head">
    <h2 class="drawer__title">Bag <span class="t-mono t-muted" data-cart-count-label>(0)</span></h2>
    <button class="icon-btn" type="button" data-cart-close aria-label="Close bag"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
  </div>
  <div class="drawer__body" data-cart-body></div>
  <div class="drawer__foot" data-cart-foot></div>
</aside>
<div class="modal" data-modal="checkout" aria-hidden="true">
  <div class="modal__backdrop" data-modal-close></div>
  <div class="modal__panel checkout" role="dialog" aria-modal="true" aria-labelledby="checkout-title" style="--w:1080px" data-checkout></div>
</div>
<div class="modal" data-modal="legal" aria-hidden="true">
  <div class="modal__backdrop" data-modal-close></div>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-label="Information" style="--w:760px">
    <button class="icon-btn modal__close" type="button" data-modal-close aria-label="Close"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
    <article class="legal" data-legal-body></article>
  </div>
</div>
<div class="toasts" data-toasts aria-live="polite"></div>
<div class="cookie" data-cookie role="region" aria-label="Cookie consent">
  <p><b>Cookies, minimal.</b> We use strictly necessary storage for your bag. Analytics only with your yes. <button type="button" class="link-btn" data-legal="cookies">Details</button></p>
  <div class="cookie__actions"><button class="btn btn--ghost" type="button" data-cookie-choice="necessary"><span class="btn__label">Necessary only</span></button><button class="btn btn--dark" type="button" data-cookie-choice="all"><span class="btn__label">Accept all</span></button></div>
</div>
<div class="curtain" data-curtain aria-hidden="true">
  <div class="curtain__panel" data-curtain-panel>
    <p class="curtain__word" data-curtain-word>Naturik<sup>®</sup></p>
    <div class="curtain__meta"><svg class="curtain__ring" viewBox="0 0 44 44"><circle class="curtain__track" cx="22" cy="22" r="19"/><circle class="curtain__arc" cx="22" cy="22" r="19"/></svg><span data-curtain-label>Loading</span></div>
    <span class="curtain__edge"></span>
  </div>
</div>
<div class="cursor" data-cursor-dot aria-hidden="true"></div>
<div class="cursor__label" data-cursor-label aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
