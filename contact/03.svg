ont-family="Hanken Grotesk"><tspan font-size="18.4" fill="rgb(243,243,241)" letter-spacing="-0.2">How long does delivery take?</tspan></text></g><g id="t|500@0-27|n27|W205.9"><text xml:space="preserve" x="607.3" y="470.4" font-family="Hanken Grotesk"><tspan font-size="18.4" fill="rgb(243,243,241)" letter-spacing="-0.2">What is your return policy?</tspan></text></g><g id="t|500@0-22|n22|W167.2"><text xml:space="preserve" x="607.3" y="543" font-family="Hanken Grotesk"><tspan font-size="18.4" fill="rgb(243,243,241)" letter-spacing="-0.2">How warm is it really?</tspan></text></g><g id="t|500@0-22|n22|W159.4"><text xml:space="preserve" x="607.3" y="615.6" font-family="Hanken Grotesk"><tspan font-size="18.4" fill="rgb(243,243,241)" letter-spacing="-0.2">Can I get it repaired?</tspan></text></g><g id="t|500@0-21|n21|W141.9"><text xml:space="preserve" x="607.3" y="688.3" font-family="Hanken Grotesk"><tspan font-size="18.4" fill="rgb(243,243,241)" letter-spacing="-0.2">Is this a real store?</tspan></text></g></svg>